# Kubernetes: Production-Grade Container Orchestration — lesson m02l04 — Jobs And CronJobs
# https://learnsome.tech/courses/kubernetes-course/watch?lesson=m02l04
# © LearnSome.tech
apiVersion: batch/v1
kind: Job
metadata:
  name: report
spec:
  completions: 1
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: busybox:1.36
          command: ["sh", "-c", "echo report complete"]
