# Kubernetes: Production-Grade Container Orchestration — lesson m02l05 — Troubleshooting: Probes, Logs, exec And CrashLoopBackOff
# https://learnsome.tech/courses/kubernetes-course/watch?lesson=m02l05
# © LearnSome.tech
apiVersion: v1
kind: Pod
metadata:
  name: probe-web
spec:
  containers:
    - name: web
      image: nginxinc/nginx-unprivileged:1.29-alpine
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /
          port: 8080
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 5
